<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn opknapfietsen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🚲 Mijn opknapfietsen</h1>
        <p>Hier houd ik bij welke fietsen ik zelf opknap.</p>
    </header>

    <main>
        <a href="index.html">← Terug naar de homepagina</a>

        <h2>Nieuwe opknapfiets</h2>

        <form id="opknap-formulier">
            <label for="fietsnaam">Naam van de fiets</label>

            <input
                type="text"
                id="fietsnaam"
                placeholder="Bijvoorbeeld: Blauwe kinderfiets"
                required
            >

            <label for="inkoopprijs">Inkoopprijs</label>

            <input
                type="text"
                inputmode="decimal"
                id="inkoopprijs"
                placeholder="Bijvoorbeeld: 25,50"
                required
            >

            <label for="onderdelenkosten">Kosten van onderdelen</label>

            <input
                type="text"
                inputmode="decimal"
                id="onderdelenkosten"
                placeholder="Bijvoorbeeld: 12,50"
                required
            >

            <label for="verkoopprijs">
                Verkoopprijs (mag nog leeg blijven)
            </label>

            <input
                type="text"
                inputmode="decimal"
                id="verkoopprijs"
                placeholder="Bijvoorbeeld: 85"
            >

            <label for="reparaties">Wat moet eraan gebeuren?</label>

            <textarea
                id="reparaties"
                placeholder="Bijvoorbeeld: nieuwe band en remmen afstellen"
            ></textarea>

            <label for="status">Status</label>

            <select id="status">
                <option>Gekocht</option>
                <option>Bezig met opknappen</option>
                <option>Klaar voor verkoop</option>
                <option>Verkocht</option>
            </select>

            <button type="submit">Opknapfiets opslaan</button>
        </form>

        <section>
            <h2>Mijn opgeslagen opknapfietsen</h2>
            <div id="fietsen-lijst"></div>
        </section>
    </main>

    <script src="eigen-fietsen.js?v=3"></script>
</body>
</html>
