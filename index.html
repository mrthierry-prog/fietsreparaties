<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinderfiets Werkplaats</title>
</head>

<body>
    <header>
        <h1>🚲 Kinderfiets Werkplaats</h1>
        <link rel="stylesheet" href="style.css">
        <p>Hier houd ik al mijn kinderfietsreparaties bij.</p>
    </header>

    <main>
        <<main>
    <h2>Nieuwe fiets toevoegen</h2>

    <form id="fiets-formulier">
        <label for="fietsnaam">Naam van de fiets</label>
        <input type="text" id="fietsnaam" placeholder="Bijvoorbeeld: Blauwe kinderfiets">

        <label for="eigenaar">Voornaam of bijnaam eigenaar</label>
        <input type="text" id="eigenaar" placeholder="Geen volledige naam">

        <label for="reparaties">Benodigde reparaties</label>
        <textarea id="reparaties" placeholder="Bijvoorbeeld: band plakken en remmen afstellen"></textarea>

        <label for="status">Status</label>
        <select id="status">
            <option>Binnengekomen</option>
            <option>Bezig</option>
            <option>Klaar</option>
            <option>Verkocht</option>
        </select>

        <button type="submit">Fiets opslaan</button>
    </form>
</main>
    </main>
</body>
</html>
